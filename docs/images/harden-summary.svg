<svg xmlns="http://www.w3.org/2000/svg" width="570" height="419" viewBox="0 0 570 419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect x="0" y="0" width="570" height="419" rx="8" fill="#0d1117" stroke="#30363d"/><circle cx="14" cy="22" r="5" fill="#ff5f57"/><circle cx="30" cy="22" r="5" fill="#febc2e"/><circle cx="46" cy="22" r="5" fill="#28c840"/><text x="285.0" y="26" fill="#8b949e" font-size="12" text-anchor="middle">harden.sh — summary</text><text x="14" y="60" font-size="14" xml:space="preserve"><tspan fill="#7ee787">╔══════════════════════════════════════════════════════════════╗</tspan></text><text x="14" y="79" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║                      HARDENING COMPLETE                      ║</tspan></text><text x="14" y="98" font-size="14" xml:space="preserve"><tspan fill="#7ee787">╠══════════════════════════════════════════════════════════════╣</tspan></text><text x="14" y="117" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  SSH port        : </tspan><tspan fill="#76c7e8">2223</tspan><tspan fill="#c9d1d9">                                      </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="136" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Auth method     : </tspan><tspan fill="#76c7e8">Pubkey + passphrase</tspan><tspan fill="#c9d1d9">                       </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="155" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Private key     : </tspan><tspan fill="#76c7e8">~/.ssh/hardened</tspan><tspan fill="#c9d1d9">                           </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="174" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  SSH certs       : </tspan><tspan fill="#76c7e8">CA + signed user cert (52w)</tspan><tspan fill="#c9d1d9">               </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="193" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Firewall        : </tspan><tspan fill="#76c7e8">UFW active (deny all, allow 2223/tcp)</tspan><tspan fill="#c9d1d9">     </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="212" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Auto-updates    : </tspan><tspan fill="#76c7e8">Enabled (security only)</tspan><tspan fill="#c9d1d9">                   </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="231" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  fail2ban        : </tspan><tspan fill="#76c7e8">Active (SSH jail, 3 strikes)</tspan><tspan fill="#c9d1d9">              </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="250" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Sysctl          : </tspan><tspan fill="#76c7e8">Kernel/network hardened</tspan><tspan fill="#c9d1d9">                   </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="269" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Shared memory   : </tspan><tspan fill="#76c7e8">noexec,nosuid,nodev</tspan><tspan fill="#c9d1d9">                       </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="288" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  auditd          : </tspan><tspan fill="#76c7e8">CIS rules + persistent journald</tspan><tspan fill="#c9d1d9">           </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="307" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Accounts        : </tspan><tspan fill="#76c7e8">root locked, pwquality, faillock</tspan><tspan fill="#c9d1d9">          </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="326" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Legacy + /tmp   : </tspan><tspan fill="#76c7e8">disabled, /tmp noexec,nodev</tspan><tspan fill="#c9d1d9">               </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="345" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  rkhunter        : </tspan><tspan fill="#76c7e8">Installed (daily cron scan)</tspan><tspan fill="#c9d1d9">               </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="364" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  AIDE            : </tspan><tspan fill="#76c7e8">File integrity monitoring (daily)</tspan><tspan fill="#c9d1d9">         </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="383" font-size="14" xml:space="preserve"><tspan fill="#7ee787">║</tspan><tspan fill="#c9d1d9">  Login MOTD      : </tspan><tspan fill="#76c7e8">Dynamic security dashboard</tspan><tspan fill="#c9d1d9">                </tspan><tspan fill="#7ee787">║</tspan></text><text x="14" y="402" font-size="14" xml:space="preserve"><tspan fill="#7ee787">╚══════════════════════════════════════════════════════════════╝</tspan></text></svg>
