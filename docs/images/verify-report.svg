-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">FAIL</tspan><tspan fill="#c9d1d9">  kernel.kptr_restrict = 1 (want 2)</tspan></text><text x="14" y="592" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7ee787">PASS</tspan><tspan fill="#c9d1d9">  kernel.dmesg_restrict = 1</tspan></text><text x="14" y="611" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7ee787">PASS</tspan><tspan fill="#c9d1d9">  kernel.yama.ptrace_scope = 1</tspan></text><text x="14" y="630" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">FAIL</tspan><tspan fill="#c9d1d9">  kernel.perf_event_paranoid = 2 (want 3)</tspan></text><text x="14" y="649" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7ee787">PASS</tspan><tspan fill="#c9d1d9">  fs.protected_hardlinks = 1</tspan></text><text x="14" y="668" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7ee787">PASS</tspan><tspan fill="#c9d1d9">  fs.protected_symlinks = 1</tspan></text><text x="14" y="687" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">FAIL</tspan><tspan fill="#c9d1d9">  fs.suid_dumpable = 2 (want 0)</tspan></text><text x="14" y="725" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">── Mounts ──</tspan></text><text x="14" y="744" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">FAIL</tspan><tspan fill="#c9d1d9">  /run/shm not hardened</tspan></text><text x="14" y="763" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">FAIL</tspan><tspan fill="#c9d1d9">  /tmp not hardened</tspan></text><text x="14" y="801" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">── Auto-updates ──</tspan></text><text x="14" y="820" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7ee