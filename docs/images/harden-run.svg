<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="761" viewBox="0 0 1366 761" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect x="0" y="0" width="1366" height="761" rx="8" fill="#0d1117" stroke="#30363d"/><circle cx="14" cy="22" r="5" fill="#ff5f57"/><circle cx="30" cy="22" r="5" fill="#febc2e"/><circle cx="46" cy="22" r="5" fill="#28c840"/><text x="683.0" y="26" fill="#8b949e" font-size="12" text-anchor="middle">sudo bash harden.sh --dry-run</text><text x="14" y="79" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="14" y="98" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">  Linux Shell Hardening Tool</tspan></text><text x="14" y="117" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="14" y="155" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  Target user : rae</tspan></text><text x="14" y="174" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  Home dir    : /home/rae</tspan></text><text x="14" y="193" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  SSH port    : 2223</tspan></text><text x="14" y="231" font-size="14" xml:space="preserve"><tspan fill="#f2cc60" font-weight="bold">[WARN]</tspan><tspan fill="#c9d1d9">  This will overwrite your sshd_config and firewall rules.</tspan></text><text x="14" y="250" font-size="14" xml:space="preserve"><tspan fill="#f2cc60" font-weight="bold">[WARN]</tspan><tspan fill="#c9d1d9">  A backup of sshd_config will be saved.</tspan></text><text x="14" y="288" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  ──── Generating SSH Key ────</tspan></text><text x="14" y="307" font-size="14" xml:space="preserve"><tspan fill="#f2cc60" font-weight="bold">[WARN]</tspan><tspan fill="#c9d1d9">  Key /home/rae/.ssh/hardened already exists — skipping generation.</tspan></text><text x="14" y="326" font-size="14" xml:space="preserve"><tspan fill="#f2cc60" font-weight="bold">[WARN]</tspan><tspan fill="#c9d1d9">  Public key already in authorized_keys — skipping.</tspan></text><text x="14" y="345" font-size="14" xml:space="preserve"><tspan fill="#7ee787">[ OK ]</tspan><tspan fill="#c9d1d9">  SSH key setup complete.</tspan></text><text x="14" y="383" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  ──── Setting up SSH Certificate Authority ────</tspan></text><text x="14" y="402" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] ssh-keygen -t ed25519 -f /etc/ssh/ssh_ca -N  -C ssh-ca@prod-web-01 -q</tspan></text><text x="14" y="421" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] chmod 600 /etc/ssh/ssh_ca</tspan></text><text x="14" y="440" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] chmod 644 /etc/ssh/ssh_ca.pub</tspan></text><text x="14" y="459" font-size="14" xml:space="preserve"><tspan fill="#7ee787">[ OK ]</tspan><tspan fill="#c9d1d9">  CA created at /etc/ssh/ssh_ca</tspan></text><text x="14" y="478" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] touch /etc/ssh/revoked_keys</tspan></text><text x="14" y="497" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] chmod 600 /etc/ssh/revoked_keys</tspan></text><text x="14" y="516" font-size="14" xml:space="preserve"><tspan fill="#7ee787">[ OK ]</tspan><tspan fill="#c9d1d9">  Empty revocation list created at /etc/ssh/revoked_keys</tspan></text><text x="14" y="554" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  ──── Signing User Certificate ────</tspan></text><text x="14" y="573" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] ssh-keygen -s /etc/ssh/ssh_ca -I rae@prod-web-01-20260810 -n rae -V +52w /home/rae/.ssh/hardened.pub</tspan></text><text x="14" y="592" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] chmod 644 /home/rae/.ssh/hardened-cert.pub</tspan></text><text x="14" y="611" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] chown rae:rae /home/rae/.ssh/hardened-cert.pub</tspan></text><text x="14" y="630" font-size="14" xml:space="preserve"><tspan fill="#7ee787">[ OK ]</tspan><tspan fill="#c9d1d9">  User certificate: /home/rae/.ssh/hardened-cert.pub (valid 52w, principal: rae)</tspan></text><text x="14" y="668" font-size="14" xml:space="preserve"><tspan fill="#76c7e8">[INFO]</tspan><tspan fill="#c9d1d9">  ──── Signing Host Certificate ────</tspan></text><text x="14" y="687" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] ssh-keygen -s /etc/ssh/ssh_ca -I host-prod-web-01-20260810 -h -n prod-web-01,prod-web-01.example.com,10.0.0.12 -V +52w /etc/ssh/ssh_host_ed25519_key.pub</tspan></text><text x="14" y="706" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">[DRY] chmod 644 /etc/ssh/ssh_host_ed25519_key-cert.pub</tspan></text><text x="14" y="725" font-size="14" xml:space="preserve"><tspan fill="#7ee787">[ OK ]</tspan><tspan fill="#c9d1d9">  Host certificate: /etc/ssh/ssh_host_ed25519_key-cert.pub (principals: prod-web-01,prod-web-01.example.com,10.0.0.12)</tspan></text></svg>
